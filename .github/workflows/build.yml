name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        continue-on-error: false

      - name: Surface gradle errors
        if: failure()
        run: |
          echo "===== TAIL build.log ====="
          tail -120 build.log || true
          ERR=$(grep -vE "^> Task |UP-TO-DATE|NO-SOURCE" build.log \
                | grep -iE "FAILURE|What went wrong|error:|Caused by|AAPT|resource|Execution failed|not found|cannot|Unresolved" \
                | tail -25 | tr '\n' '§')
          echo "::error::ERR→ ${ERR}"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CarBridgeHotspot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
